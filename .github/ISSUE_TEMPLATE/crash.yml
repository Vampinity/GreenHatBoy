name: Crash or glitch
description: The game crashed, froze, or showed something wrong
labels: ["report"]
body:
  - type: dropdown
    id: console
    attributes:
      label: Console
      options: ["PS5 (base, disc or digital)", "PS5 Slim", "PS5 Pro"]
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      placeholder: "12.40"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The build you are testing, or the version line at the top of a crash file.
      placeholder: "test build of 12 Nov"
    validations:
      required: true
  - type: dropdown
    id: settings
    attributes:
      label: Settings file in use
      options: ["env.txt (as shipped)", "env-13x.txt", "env-fast.txt", "env-gbb-everyday.txt", "my own changes (say which below)"]
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader and its version
      description: The tool that puts homebrew on your home screen.
      placeholder: "ShadowMountPlus 1.7beta11"
  - type: dropdown
    id: start
    attributes:
      label: How did this session start
      options:
        - "New Game, the first start after installing or updating"
        - "New Game, a later start"
        - "Continue from a save"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Console mode in the app
      options: ["Docked (default)", "Handheld", "Not sure"]
  - type: input
    id: appsettings
    attributes:
      label: Settings changed in the app's own menu
      description: For example a frame rate limit or another resolution. Write "none" if you left them alone.
      placeholder: "none"
  - type: input
    id: howlong
    attributes:
      label: How long had the game been running
      placeholder: "about 8 minutes"
    validations:
      required: true
  - type: dropdown
    id: ending
    attributes:
      label: How did it end
      options:
        - "The app closed by itself, back to the PS5 home screen"
        - "The picture froze, and the app closed a while later"
        - "The picture froze and I closed the app myself"
        - "The screen stayed black"
        - "It kept running, but something looked or sounded wrong"
    validations:
      required: true
  - type: dropdown
    id: repeat
    attributes:
      label: Does it happen again when you retry
      options: ["Every time, at the same spot", "Sometimes", "I tried once"]
  - type: textarea
    id: what
    attributes:
      label: What happened, and where in the game
      description: What you saw, and what you were doing in the minute before. For a crash, did you open the pause menu shortly before? Please keep story details vague, others may not have played that far.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: >
        For a crash, drag in the newest crash-*.txt from /data/eglantineps5/logs/ and the crash-*-eden_log.txt with the same time.
        No crash file? Attach /data/eglantineps5/user/log/eden_log.txt.
        Files here are public: first delete the two lines containing EDEN_PAD_OPEN and EDEN_PAD_USERS (your console's user number).
  - type: checkboxes
    id: ok
    attributes:
      label: Before you post
      options:
        - label: I removed the EDEN_PAD_OPEN and EDEN_PAD_USERS lines from any log I attached, and nothing here contains game files, keys or firmware.
          required: true
