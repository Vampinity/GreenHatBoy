<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 168" width="820" height="168" role="img" aria-label="What has been fixed, by date">
<rect width="820" height="168" fill="#0d1117"/>
<line x1="40" y1="52" x2="785" y2="52" stroke="#30363d" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
<line x1="40" y1="52" x2="560" y2="52" stroke="#3fb950" stroke-width="6" stroke-linecap="round"/>
<circle cx="40" cy="52" r="11" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
<path d="M35 52 l4 4 l7 -8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">5 Nov</text>
<text x="40" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">It starts</text>
<circle cx="135" cy="52" r="11" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
<path d="M130 52 l4 4 l7 -8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="135" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">6-7 Nov</text>
<text x="135" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Fog gone,</text>
<text x="135" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">leaves back</text>
<circle cx="235" cy="52" r="11" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
<path d="M230 52 l4 4 l7 -8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="235" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">8 Nov</text>
<text x="235" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">No dark flashes,</text>
<text x="235" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">movies closer</text>
<text x="235" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">to sync</text>
<circle cx="335" cy="52" r="11" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
<path d="M330 52 l4 4 l7 -8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="335" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">9 Nov</text>
<text x="335" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Shorter freezes</text>
<text x="335" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">on a first visit</text>
<circle cx="440" cy="52" r="11" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
<path d="M435 52 l4 4 l7 -8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">10-11 Nov</text>
<text x="440" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">10% faster,</text>
<text x="440" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">memory waits</text>
<text x="440" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">(in tests)</text>
<circle cx="560" cy="52" r="11" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
<path d="M555 52 l4 4 l7 -8" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="560" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">12 Nov</text>
<text x="560" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">No black screen</text>
<text x="560" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">on first start,</text>
<text x="560" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">title movie smooth,</text>
<text x="560" y="134" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">no jumping icons</text>
<circle cx="685" cy="52" r="11" fill="#d29922" stroke="#0d1117" stroke-width="3"/>
<text x="685" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">now</text>
<text x="685" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Fresh install</text>
<text x="685" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">past the door,</text>
<text x="685" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">long-play crashes,</text>
<text x="685" y="134" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">then open-area speed</text>
<circle cx="785" cy="52" r="11" fill="#30363d" stroke="#0d1117" stroke-width="3"/>
<text x="785" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">goal</text>
<text x="785" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1">The whole</text>
<text x="785" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9198a1">game</text>
<text x="410" y="156" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">Steps of work, not a share of the game</text>
</svg>