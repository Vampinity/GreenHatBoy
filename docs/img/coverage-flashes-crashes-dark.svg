>Order probe</text><text x="417.0" y="142" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#EF9F27">one start only</text><rect x="502" y="104" width="138" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="571.0" y="124" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Lower-res stop</text><text x="571.0" y="142" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">never run</text><rect x="40" y="200" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="109.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">Out of memory</text><text x="109.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5DCAA5">18 in 1,055 runs</text><rect x="194" y="200" width="138" height="56" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/><text x="263.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#FAC775">Which request</text><text x="263.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#EF9F27">two cases known</text><rect x="348" y="200" width="138" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="417.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Other kinds</text><text x="417.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">device lost, JIT</text><rect x="502" y="200" width="138" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="571.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Crash rate</text><text x="571.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">never computed</text><rect x="40" y="278" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="62" y="285" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#c2c0b6">Measured, repeats</text><rect x="208" y="278" width="14" height="14" rx="3" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/><text x="230" y="285" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#c2c0b6">Partly known</text><rect x="348" y="278" width="14" height="14" rx="3" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/><text x="370" y="285" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#c2c0b6">Never measured (dashed)</text></svg>