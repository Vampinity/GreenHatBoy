<svg xmlns="http://www.w3.org/2000/svg" width="680" height="312" viewBox="0 0 680 312" role="img"><title>Flashes and crashes programme: what is measured and what is not</title><desc>Two bands: the flash arms that have been counted, and the crash kinds that have been counted.</desc><text x="40" y="24" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#c2c0b6">Flashes</text><text x="40" y="186" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#c2c0b6">Crashes</text><rect x="40" y="38" width="138" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="109.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Two ahead</text><text x="109.0" y="76" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">never counted</text><rect x="194" y="38" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="263.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">One ahead</text><text x="263.0" y="76" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5DCAA5">418 of 418 runs</text><rect x="348" y="38" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="417.0" y="58" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">Ahead off</text><text x="417.0" y="76" tex