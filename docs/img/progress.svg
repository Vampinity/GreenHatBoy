<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 168" width="820" height="168" role="img" aria-label="What has been fixed, by date">
<rect width="820" height="168" fill="#ffffff"/>
<line x1="40" y1="52" x2="785" y2="52" stroke="#d1d9e0" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
<line x1="40" y1="52" x2="560" y2="52" stroke="#1a7f37" stroke-width="6" stroke-linecap="round"/>
<circle cx="40" cy="52" r="11" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
<path d="M35 52 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">5 Nov</text>
<text x="40" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">It starts</text>
<circle cx="135" cy="52" r="11" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
<path d="M130 52 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="135" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">6-7 Nov</text>
<text x="135" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">Fog gone,</text>
<text x="135" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">leaves back</text>
<circle cx="235" cy="52" r="11" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
<path d="M230 52 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="235" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">8 Nov</text>
<text x="235" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">No dark flashes,</text>
<text x="235" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">movies closer</text>
<text x="235" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">to sync</text>
<circle cx="335" cy="52" r="11" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
<path d="M330 52 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="335" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">9 Nov</text>
<text x="335" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">Shorter freezes</text>
<text x="335" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">on a first visit</text>
<circle cx="440" cy="52" r="11" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
<path d="M435 52 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">10-11 Nov</text>
<text x="440" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">10% faster,</text>
<text x="440" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">memory waits</text>
<text x="440" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">(in tests)</text>
<circle cx="560" cy="52" r="11" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
<path d="M555 52 l4 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="560" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">12 Nov</text>
<text x="560" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">No black screen</text>
<text x="560" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">on first start,</text>
<text x="560" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">title movie smooth,</text>
<text x="560" y="134" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">no jumping icons</text>
<circle cx="685" cy="52" r="11" fill="#9a6700" stroke="#ffffff" stroke-width="3"/>
<text x="685" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">now</text>
<text x="685" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">Fresh install</text>
<text x="685" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">past the door,</text>
<text x="685" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">long-play crashes,</text>
<text x="685" y="134" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1f2328">then open-area speed</text>
<circle cx="785" cy="52" r="11" fill="#d1d9e0" stroke="#ffffff" stroke-width="3"/>
<text x="785" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">goal</text>
<text x="785" y="86" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e">The whole</text>
<text x="785" y="102" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e">game</text>
<text x="410" y="156" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">Steps of work, not a share of the game</text>
</svg>