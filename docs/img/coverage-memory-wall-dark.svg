<svg xmlns="http://www.w3.org/2000/svg" width="680" height="318" viewBox="0 0 680 318" role="img"><title>Memory wall programme: what is measured and what is not</title><desc>The eight holders of the memory pool, coloured by how well each is measured, with three gaps below.</desc><rect x="40" y="40" width="138" height="56" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/><text x="109.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#FAC775">Guest memory</text><text x="109.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#EF9F27">total, not split</text><rect x="194" y="40" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="263.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">GPU memory</text><text x="263.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5DCAA5">peak, 1,055 runs</text><rect x="348" y="40" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="417.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">Emulator heap</text><text x="417.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5DCAA5">416 to 2,166 MiB</text><rect x="502" y="40" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="571.0" y="60" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">JIT</text><text x="571.0" y="78" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5DCAA5">448 to 496 MiB</text><rect x="40" y="116" width="138" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="109.0" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#9FE1CB">Textures</text><text x="109.0" y="154" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#5DCAA5">MiB, 600 frames</text><rect x="194" y="116" width="138" height="56" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/><text x="263.0" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#FAC775">Buffer cache</text><text x="263.0" y="154" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#EF9F27">queue not counted</text><rect x="348" y="116" width="138" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="417.0" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Render targets</text><text x="417.0" y="154" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">never sized</text><rect x="502" y="116" width="138" height="56" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/><text x="571.0" y="136" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#FAC775">Pipeline cache</text><text x="571.0" y="154" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#EF9F27">one data point</text><rect x="40" y="200" width="188" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="134.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Holder table</text><text x="134.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">none at a peak yet</text><rect x="246" y="200" width="188" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="340.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">Kokiri transitions</text><text x="340.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">never censused</text><rect x="452" y="200" width="188" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/><text x="546.0" y="220" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">The 10 s block wait</text><text x="546.0" y="238" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#B4B2A9">seen once, not traced</text><rect x="40" y="284" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/><text x="62" y="291" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#c2c0b6">Measured, repeats</text><rect x="208" y="284" width="14" height="14" rx="3" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/><text x="230" y="291" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#c2c0b6">Partly known</text><rect x="348" y="284" width="14" height="14" rx="3" fill="#444441" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/><text x="370" y="291" dominant-baseline="central" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#c2c0b6">Never measured (dashed)</text></svg>